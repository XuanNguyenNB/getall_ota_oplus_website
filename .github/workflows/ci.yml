name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Ruff format
        run: ruff format --check src/ tests/
      - name: Mypy
        run: mypy src/ota_backend
      - name: Node syntax check (static JS)
        # The static bundle is hand-authored vanilla ES modules; a syntactic
        # node --check is enough to catch typos before they reach prod.
        run: |
          node --check src/ota_backend/static/app.js
          for f in src/ota_backend/static/modules/*.js; do
            node --check "$f"
          done
      - name: Unit and integration proof
        run: python -m pytest
      - name: Compile
        run: python -m compileall -q src tests
      - name: Container configuration
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ci-placeholder
        run: |
          cp .env.example .env
          docker compose config --quiet
