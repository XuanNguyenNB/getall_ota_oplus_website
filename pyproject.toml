[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "getall-ota-oplus-backend"
version = "0.1.0"
description = "Phase 1 FastAPI backend for private OPlus OTA discovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "python-telegram-bot==22.7",
  "supabase>=2.15,<2.19",
  "realme-ota @ git+https://github.com/R0rt1z2/realme-ota.git@d2641674c279c998ff8e1a92bb761474d1b62268",
  "uvicorn[standard]>=0.32,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/ota_backend"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
